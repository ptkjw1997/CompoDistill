[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compodistill"
version = "1.0.0"
description = "CompoDistill: Attention Distillation for Compositional Reasoning in Multimodal LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/ptkjw1997/CompoDistill"
Paper = "https://arxiv.org/abs/2510.12184"

[tool.setuptools.packages.find]
include = ["compodistill*"]
